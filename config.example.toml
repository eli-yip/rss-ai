[app]
env = "dev"            # dev | prod

[log]
level = "info"         # debug | info | error

[server]
addr = ":8080"

[db]
dsn = "postgres://user:pass@host:5432/rss_ai?sslmode=disable"

[upstream]
base_url = "https://rsshub.example.com"

[ai]
base_url = "https://api.openai.com/v1"
api_key  = "sk-replace-me"
model    = "gpt-4o-mini"
rpm      = 10000
request_timeout = "30s"

[gateway]
wait_timeout = "10s"

# Enabled prefixes (switch + allowlist). prompt is optional.
#
# Telegram channel feeds have synthetic (truncated) titles, so a specialized
# handler is registered for this exact prefix. With no prompt it uses that
# handler's built-in Telegram prompt; set prompt here to override it (spec §4).
[handlers."/telegram/channel"]
enabled = true
